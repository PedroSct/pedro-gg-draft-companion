# Coleta partidas de alto elo na Match-v5 da Riot em vários servidores e publica o meta.json GLOBAL (todos somados)
# e um arquivo por servidor (meta-br1.json...) para o app poder escolher. Os dados trazem winrates, confrontos,
# desempenho contra o time inimigo, dano/tanque/CC, builds, ordem de habilidades, runas e feitiços, na branch "data".
# O app dos seus amigos baixa de lá sozinho.
#
# Como usar:
#   1. developer.riotgames.com > entre com a conta do LoL > copie a chave (Development ou Personal API Key).
#   2. Settings > Secrets and variables > Actions > New repository secret: nome RIOT_API_KEY, valor = a chave.
#   3. Aba Actions > "Atualizar dados de meta" > Run workflow (escolha os servidores). Cada execução leva até ~5,6 h; o agendamento abaixo repete sozinho.
#
# Como funciona: o limite da chave é por cluster da Riot (americas, europe, asia, sea). Servidores de clusters
# diferentes coletam em paralelo (um job por cluster); servidores do mesmo cluster rodam em sequência no mesmo job.
# No fim, as contagens de todos os servidores são somadas num único arquivo. Só entram partidas do mesmo patch.
#
# A chave de desenvolvimento expira em 24 h: se vencer no meio, o que já foi coletado é aproveitado (desde que seja
# suficiente) e a próxima execução continua de onde parou. Para rodar toda semana sem trocar a chave, peça uma
# "Personal API Key" no mesmo portal e coloque no mesmo secret (a velocidade continua a mesma: 100 requisições a cada 2 min).
name: Atualizar dados de meta

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Servidores separados por vírgula (br1, na1, la1, la2, euw1, eun1, tr1, kr, jp1, oc1, ph2, sg2, th2, tw2, vn2; ru também funciona, mas não vem no padrão). Um cluster da Riot roda em paralelo; servidores do mesmo cluster dividem o tempo do job.
        default: br1,na1,la1,la2,euw1,eun1,tr1,kr,jp1,oc1,ph2,sg2,th2,tw2,vn2
      max_matches:
        description: Teto de partidas por servidor no patch (winrates, confrontos, sinergias). O tempo do job (cerca de 7 mil partidas por execução) costuma acabar antes do teto.
        default: '200000'
      timeline_matches:
        description: Destas, quantas também baixam a timeline (builds, itens, habilidades). 0 = todas.
        default: '100000'
      rps:
        description: Requisições por segundo. Mantenha 0.8 - o limite longo da Riot (100 a cada 2 min) vale também para chave aprovada; acima disso dá erro 429.
        default: '0.8'
      tiers:
        description: Elos dos jogadores (challenger, grandmaster, master, diamond, emerald, platinum). Emerald e Diamond deixam o meta parecido com o do OP.GG e Lolalytics.
        default: challenger,grandmaster,master,diamond,emerald
      days:
        description: Só partidas dos últimos N dias (mais dias = mais partidas disponíveis no começo do patch).
        default: '14'
  schedule:
    # A cada 8 horas (01:00, 09:00 e 17:00 UTC). Cada execução leva até ~5,6 h e continua de onde a anterior parou, então
    # os dados do patch só crescem. Precisa da chave pessoal (a de desenvolvimento vence em 24 h).
    - cron: '0 1,9,17 * * *'

permissions:
  contents: write # publicar a branch "data"

concurrency:
  group: update-meta
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Montar a lista de servidores
        id: plan
        run: echo "matrix=$(pnpm -s meta:plan --platforms "${{ inputs.platforms || 'br1,na1,la1,la2,euw1,eun1,tr1,kr,jp1,oc1,ph2,sg2,th2,tw2,vn2' }}")" >> "$GITHUB_OUTPUT"

  collect:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Conferir a chave
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: |
          if [ -z "$RIOT_API_KEY" ]; then
            echo "::error::Falta o secret RIOT_API_KEY (veja as instruções no topo deste arquivo)."
            exit 1
          fi
          # A chave é testada com uma chamada barata, para falhar logo e com um aviso claro se estiver vencida.
          first=$(echo "${{ matrix.platforms }}" | awk '{print $1}')
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "X-Riot-Token: $RIOT_API_KEY" "https://${first}.api.riotgames.com/lol/status/v4/platform-data" || echo 000)
          if [ "$code" = "401" ] || [ "$code" = "403" ]; then
            echo "::error::A chave da Riot foi recusada (HTTP $code). Ela venceu ou está errada: atualize o secret RIOT_API_KEY."
            exit 1
          fi

      # O progresso fica guardado entre execuções: se a chave vencer, a próxima continua de onde parou.
      - name: Recuperar o progresso
        uses: actions/cache/restore@v4
        with:
          path: meta-work
          key: meta-work-${{ matrix.region }}-${{ github.run_id }}
          restore-keys: meta-work-${{ matrix.region }}-

      - name: Coletar partidas (${{ matrix.platforms }})
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          PLATFORMS: ${{ matrix.platforms }}
          MAX_MATCHES: ${{ inputs.max_matches || '200000' }}
          TIMELINE_MATCHES: ${{ inputs.timeline_matches || '100000' }}
          RPS: ${{ inputs.rps || '0.8' }}
          DAYS: ${{ inputs.days || '14' }}
          TIERS: ${{ inputs.tiers || 'challenger,grandmaster,master,diamond,emerald' }}
        run: |
          # Um servidor que falha (chave vencida, limite) não impede os outros do cluster; o progresso fica salvo.
          failed=0
          # O job tem 350 min. Cada servidor para sozinho no seu tempo e gera o arquivo com o que já coletou
          # (assim o job termina bem e os dados são publicados); a próxima execução continua de onde parou.
          start=$(date +%s)
          total=$(echo "$PLATFORMS" | wc -w)
          i=0
          for p in $PLATFORMS; do
            i=$((i+1))
            left=$(( 335 - ($(date +%s) - start) / 60 ))
            share=$(( left / (total - i + 1) ))
            if [ "$share" -lt 5 ]; then echo "::warning::Sem tempo para $p nesta execução."; continue; fi
            echo "::group::Servidor $p (até $share min)"
            pnpm meta:build --platform "$p" --max-matches "$MAX_MATCHES" --timeline-matches "$TIMELINE_MATCHES" --rps "$RPS" --days "$DAYS" --tiers "$TIERS" --max-minutes "$share" --out "meta-$p.json" --work meta-work || failed=$((failed+1))
            echo "::endgroup::"
          done
          if [ "$failed" -gt 0 ]; then
            echo "::warning::$failed servidor(es) pararam antes do fim (provavelmente a chave venceu). O que foi coletado entra nos dados."
          fi

      - name: Guardar o progresso
        if: always()
        uses: actions/cache/save@v4
        with:
          path: meta-work
          key: meta-work-${{ matrix.region }}-${{ github.run_id }}

      - name: Enviar as coletas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: states-${{ matrix.region }}
          path: meta-work/state-v3-*.json
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs: [plan, collect]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          pattern: states-*
          path: states
          merge-multiple: true

      - name: Juntar os servidores
        run: pnpm meta:merge --per-region --out meta.json states/*.json

      - name: Conferir a qualidade
        run: pnpm meta:check meta.json --strict

      - name: Publicar na branch data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir pub && cp meta.json meta-*.json pub/ && (cp holdout.json pub/ 2>/dev/null || true) && cd pub
          git init -q
          git config user.name "pedro-gg-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -q --orphan data
          git add meta.json meta-*.json
          [ -f holdout.json ] && git add holdout.json || true
          git commit -q -m "Dados de meta ($(date -u +%F))"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" data
